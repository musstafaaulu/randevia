name: randevia

# The whole system: `docker compose up -d --build`, then use http://localhost:3000.
# Only the api-gateway (and the RabbitMQ management UI) is published on the
# host; the services and their databases are reachable only inside the
# compose network, so all client traffic goes through the gateway.
#
# Secrets have no defaults: copy .env.example to .env and fill them in first;
# compose refuses to start while one is missing.

x-mongo-healthcheck: &mongo-healthcheck
  test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 20s

x-service: &service
  restart: unless-stopped
  init: true

services:
  # ---------------------------------------------------------------- infra --
  rabbitmq:
    image: rabbitmq:3-management
    container_name: randevia-rabbitmq
    # RabbitMQ stores its data under a directory named after the node's
    # hostname, so it must be fixed for the volume to survive re-creation.
    hostname: randevia-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
    ports:
      - '5672:5672' # AMQP (for running services and tests on the host)
      - '15672:15672' # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Database per service: each service owns its own MongoDB instance.
  mongo-auth:
    image: mongo:7
    container_name: randevia-mongo-auth
    restart: unless-stopped
    volumes:
      - mongo_auth_data:/data/db
    healthcheck: *mongo-healthcheck

  # A single-node replica set, not a standalone instance: appointment.service.ts
  # writes an appointment change and its outbox event in one transaction
  # (see src/models/OutboxEvent.model.ts), and MongoDB only supports
  # transactions on a replica set (even a one-member one). The healthcheck
  # self-initiates the replica set on first boot - rs.status() fails until
  # then, which is also exactly what "not healthy yet" should mean here.
  mongo-appointment:
    image: mongo:7
    container_name: randevia-mongo-appointment
    command: ['mongod', '--replSet', 'rs0', '--bind_ip_all']
    restart: unless-stopped
    volumes:
      - mongo_appointment_data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - >-
          try { rs.status().ok } catch (e) {
          rs.initiate({_id:'rs0', members:[{_id:0, host:'mongo-appointment:27017'}]}).ok }
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s

  mongo-notification:
    image: mongo:7
    container_name: randevia-mongo-notification
    restart: unless-stopped
    volumes:
      - mongo_notification_data:/data/db
    healthcheck: *mongo-healthcheck

  # Socket.io adapter: lets notification-service scale to more than one
  # instance while every instance still sees every real-time event.
  redis:
    image: redis:7-alpine
    container_name: randevia-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Catches every e-mail the backend sends in development instead of
  # delivering it anywhere; its web UI (http://localhost:8025) lists them.
  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: randevia-mailhog
    restart: unless-stopped
    ports:
      - '8025:8025' # Web UI + JSON API

  # --------------------------------------------------------- observability --
  # Collects the distributed traces every service emits (see src/tracing.ts
  # in each): OpenTelemetry auto-instrumentation sends spans here over OTLP,
  # Jaeger's own UI (http://localhost:16686) renders the resulting traces.
  jaeger:
    image: jaegertracing/all-in-one:1.65.0
    container_name: randevia-jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: 'true'
    ports:
      - '16686:16686' # UI
      - '4317:4317' # OTLP gRPC
      - '4318:4318' # OTLP HTTP

  # Scrapes every service's /metrics on a timer (see monitoring/prometheus/prometheus.yml).
  prometheus:
    image: prom/prometheus:v3.0.1
    container_name: randevia-prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - '9090:9090'

  # Pre-provisioned with a Prometheus + Jaeger datasource and one dashboard
  # (monitoring/grafana/dashboards/randevia.json) - nothing to click through
  # by hand after `docker compose up`. Default login: admin / admin.
  grafana:
    image: grafana/grafana:11.3.1
    container_name: randevia-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - '3001:3000'
    depends_on:
      - prometheus
      - jaeger

  # ------------------------------------------------------------- services --
  auth-service:
    <<: *service
    build: ./auth-service
    image: randevia/auth-service
    container_name: randevia-auth-service
    environment:
      PORT: 4000
      MONGO_URI: mongodb://mongo-auth:27017/randevia_auth
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is not set. Copy .env.example to .env and fill it in}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@randevia.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is not set. Copy .env.example to .env and fill it in}
      ADMIN_NAME: ${ADMIN_NAME:-Randevia Admin}
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      SMTP_FROM: ${SMTP_FROM:-Randevia <no-reply@randevia.local>}
      # The browser's address for the web UI (links inside e-mails), not this
      # container's - same convention as WEB_API_BASE_URL for the gateway.
      WEB_BASE_URL: http://localhost:${WEB_PORT:-8080}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN is not set. Copy .env.example to .env and fill it in}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      TRUST_PROXY: 1
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      mongo-auth:
        condition: service_healthy

  appointment-service:
    <<: *service
    build: ./appointment-service
    image: randevia/appointment-service
    container_name: randevia-appointment-service
    environment:
      PORT: 4001
      MONGO_URI: mongodb://mongo-appointment:27017/randevia_appointment
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is not set. Copy .env.example to .env and fill it in}
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-guest}:${RABBITMQ_DEFAULT_PASS:-guest}@rabbitmq:5672
      RABBITMQ_EXCHANGE: randevia.events
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      TRUST_PROXY: 1
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      mongo-appointment:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  notification-service:
    <<: *service
    build: ./notification-service
    image: randevia/notification-service
    container_name: randevia-notification-service
    environment:
      PORT: 4002
      MONGO_URI: mongodb://mongo-notification:27017/randevia_notification
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is not set. Copy .env.example to .env and fill it in}
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-guest}:${RABBITMQ_DEFAULT_PASS:-guest}@rabbitmq:5672
      RABBITMQ_EXCHANGE: randevia.events
      NOTIFICATION_QUEUE: notification-service.appointment-events
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      SMTP_FROM: ${SMTP_FROM:-Randevia <no-reply@randevia.local>}
      AUTH_SERVICE_URL: http://auth-service:4000
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN is not set. Copy .env.example to .env and fill it in}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      TRUST_PROXY: 1
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      mongo-notification:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy

  api-gateway:
    <<: *service
    build: ./api-gateway
    image: randevia/api-gateway
    container_name: randevia-api-gateway
    environment:
      PORT: 3000
      AUTH_SERVICE_URL: http://auth-service:4000
      APPOINTMENT_SERVICE_URL: http://appointment-service:4001
      NOTIFICATION_SERVICE_URL: http://notification-service:4002
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-300}
      AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-20}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - '${GATEWAY_PORT:-3000}:3000'
    depends_on:
      auth-service:
        condition: service_healthy
      appointment-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy

  # ------------------------------------------------------------------ web --
  web:
    <<: *service
    build:
      context: ./web
      args:
        # Baked into the static bundle at build time; the browser (not this
        # container) is what talks to the gateway, at whatever host/port the
        # person opening the site uses.
        VITE_API_BASE_URL: ${WEB_API_BASE_URL:-http://localhost:3000}
    image: randevia/web
    container_name: randevia-web
    ports:
      - '${WEB_PORT:-8080}:80'
    depends_on:
      api-gateway:
        condition: service_healthy

volumes:
  rabbitmq_data:
  mongo_auth_data:
  mongo_appointment_data:
  mongo_notification_data:
  redis_data:
  prometheus_data:
  grafana_data:
