name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - appointment-service
          - notification-service
          - api-gateway
    services:
      rabbitmq:
        image: rabbitmq:3-management
        ports: ['5672:5672']
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      # A plain `services:` entry can't run mongod with --replSet (no command
      # override), but appointment-service's transactional outbox needs
      # MongoDB transactions, which only work on a replica set - even a
      # single-node one. Same thing scripts/README tell a local dev to do.
      - name: Start MongoDB (single-node replica set)
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:7 --replSet rs0 --bind_ip_all
          until docker exec mongo mongosh --quiet --eval "db.adminCommand('ping').ok"; do sleep 1; done
          docker exec mongo mongosh --quiet --eval "rs.initiate({_id:'rs0',members:[{_id:0,host:'127.0.0.1:27017'}]})"
          until docker exec mongo mongosh --quiet --eval "rs.status().ok" 2>/dev/null; do sleep 1; done

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.service }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.service }}
        run: npm ci

      - name: Lint
        working-directory: ${{ matrix.service }}
        run: npm run lint

      - name: Type check / build
        working-directory: ${{ matrix.service }}
        run: npm run build

      - name: Test (with coverage threshold)
        working-directory: ${{ matrix.service }}
        run: npm test -- --coverage

  web:
    name: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Type check / build
        working-directory: web
        run: npm run build

      - name: Unit/component tests (with coverage threshold)
        working-directory: web
        run: npm test -- --coverage

  docker-build:
    name: docker build (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - appointment-service
          - notification-service
          - api-gateway
          - web
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t randevia/${{ matrix.service }}:ci ./${{ matrix.service }}
